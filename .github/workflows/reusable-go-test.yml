# Reusable: run Go unit and integration tests (`go test ./...`).
# Call from CI (PR/main), release, or other workflows via workflow_call.
name: Reusable — Go test

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version
        type: string
        required: false
        default: "1.24.x"
      checkout-fetch-depth:
        description: git fetch-depth for checkout
        type: number
        required: false
        default: 1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: congee
          POSTGRES_PASSWORD: congee
          POSTGRES_DB: congee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U congee"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.checkout-fetch-depth }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@1.88

      - uses: actions/cache@v4
        with:
          path: ~/.cache/congee/turso-fts/target
          key: turso-fts-36da5b2e-${{ runner.os }}-${{ runner.arch }}

      - run: go mod download && ./scripts/overlay-turso-fts.sh

      - run: CGO_ENABLED=1 go test ./...
      - run: go test ./...
        working-directory: sdk/plugin
      - run: CGO_ENABLED=1 go test ./internal/storage/postgres -run '^TestEventPage'
        env:
          TEST_POSTGRES_DSN: postgres://congee:congee@127.0.0.1:5432/congee_test?sslmode=disable

  test-race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: congee
          POSTGRES_PASSWORD: congee
          POSTGRES_DB: congee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U congee"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.checkout-fetch-depth }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@1.88

      - uses: actions/cache@v4
        with:
          path: ~/.cache/congee/turso-fts/target
          key: turso-fts-36da5b2e-${{ runner.os }}-${{ runner.arch }}

      - run: go mod download && ./scripts/overlay-turso-fts.sh

      - run: CGO_ENABLED=1 go test -race ./...
      - run: go test -race ./...
        working-directory: sdk/plugin
      - run: CGO_ENABLED=1 go test -race ./internal/storage/postgres -run '^TestEventPage'
        env:
          TEST_POSTGRES_DSN: postgres://congee:congee@127.0.0.1:5432/congee_test?sslmode=disable
